<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSME回购方案计算器</title>
    <style>
        :root {
            --primary-color: #409eff;
            --border-color: #ebeef5;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: var(--bg-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        .input-group {
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            overflow-x: auto;
            display: block;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: center;
            min-width: 120px;
        }

        th {
            background-color: var(--bg-color);
        }

        .highlight {
            color: var(--primary-color);
            font-weight: bold;
        }

        @media (max-width: 768px) {
            td, th {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-group">
            <div>
                <label>个人早期鸟金额（元）</label>
                <input type="number" id="N" placeholder="输入认购金额">
            </div>
            <div>
                <label>个人早期鸟数量（DSME）</label>
                <input type="number" id="M" placeholder="输入认购数量">
            </div>
            <div>以下数据的默认值为最新真实值，无需更改；如需模拟情况，可自行更改</div>
            <div>
                <label>待分配池数量（DSME）</label>
                <input type="number" id="X" value="10000">
            </div>
            <div>
                <label>总分配系数</label>
                <input type="number" id="Y" value="3000">
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th></th>
                    <th>方案一：100%回购</th>
                    <th>方案二：80%回购</th>
                    <th>方案三：40%回购</th>
                    <th>方案四：不回购</th>
                </tr>
            </thead>
            <tbody>
                <!-- 现金返还 -->
                <tr>
                    <td>回购-现金返还</td>
                    <td id="cash1">-</td>
                    <td id="cash2">-</td>
                    <td id="cash3">-</td>
                    <td id="cash4">-</td>
                </tr>
                <!-- Token分配 -->
                <tr>
                    <td>Token-归属个人(含补贴)</td>
                    <td id="token1">-</td>
                    <td id="token2">-</td>
                    <td id="token3">-</td>
                    <td id="token4">-</td>
                </tr>
                <tr>
                    <td>Token-划入待分配池(奖励给其他方案选择者)</td>
                    <td id="wtoken1">-</td>
                    <td id="wtoken2">-</td>
                    <td id="wtoken3">-</td>
                    <td id="wtoken4">-</td>
                </tr>
                <tr>
                    <td>待分配池-个人分配系数</td>
                    <td id="xishu1">-</td>
                    <td id="xishu2">-</td>
                    <td id="xishu3">-</td>
                    <td id="xishu4">-</td>
                </tr>
                <!-- 待分配池奖励 -->
                <tr>
                    <td>待分配池-个人Token奖励</td>
                    <td id="reward1">-</td>
                    <td id="reward2">-</td>
                    <td id="reward3">-</td>
                    <td id="reward4">-</td>
                </tr>
                <tr>
                    <td>Token-个人总Token数量(回购后)</td>
                    <td id="Areward1">-</td>
                    <td id="Areward2">-</td>
                    <td id="Areward3">-</td>
                    <td id="Areward4">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => input.addEventListener('input', updateCalculations));

        function updateCalculations() {
            const N = parseFloat(document.getElementById('N').value) || 0;
            const M = parseFloat(document.getElementById('M').value) || 0;
            const X = parseFloat(document.getElementById('X').value) || 0;
            const Y = parseFloat(document.getElementById('Y').value) || 1;

            // 现金返还计算
            document.getElementById('cash1').textContent = (0.6 * N).toFixed(2);
            document.getElementById('cash2').textContent = (0.48 * N).toFixed(2);
            document.getElementById('cash3').textContent = (0.24 * N).toFixed(2);
            document.getElementById('cash4').textContent = '0.00';

            // 待分配池
            document.getElementById('wtoken1').textContent = (0.8 * M).toFixed(2);
            document.getElementById('wtoken2').textContent = (0.55 * M).toFixed(2);
            document.getElementById('wtoken3').textContent = (0.1 * M).toFixed(2);
            document.getElementById('wtoken4').textContent = '0.00';

            // 分配系数
            document.getElementById('xishu1').textContent = (0 * M).toFixed(2);
            document.getElementById('xishu2').textContent = (0.2 * M).toFixed(2);
            document.getElementById('xishu3').textContent = (0.4 * M).toFixed(2);
            document.getElementById('xishu4').textContent = (1.6 * M).toFixed(2);


            // 个人token
            document.getElementById('token1').textContent = (0.2 * M).toFixed(2) + '(含补贴'+ (0.2 * M).toFixed(2) +')';
            document.getElementById('token2').textContent = (0.45 * M).toFixed(2) + '(含补贴'+ (0.25 * M).toFixed(2) +')';
            document.getElementById('token3').textContent = (0.9 * M).toFixed(2) + '(含补贴'+ (0.3 * M).toFixed(2) +')';
            document.getElementById('token4').textContent = (1.0 * M).toFixed(2) + '(含补贴'+ (0 * M).toFixed(2) +')';

            //个人总Token
            document.getElementById('Areward1').textContent = (0.2 * M + 0).toFixed(2);
            document.getElementById('Areward2').textContent = (0.45 * M + X * (0.2 * M) / (Y+0.2 * M)).toFixed(2);
            document.getElementById('Areward3').textContent = (0.9 * M + X * (0.4 * M) / (Y+0.4 * M)).toFixed(2);
            document.getElementById('Areward4').textContent = (1.0 * M + X * (1.6 * M) / (Y+1.6 * M)).toFixed(2);

            // DSME奖励计算
            const rewards = [
                () => 0,
                () => X * (0.2 * M) / (Y+0.2 * M),
                () => X * (0.4 * M) / (Y+0.4 * M),
                () => X * (1.6 * M) / (Y+1.6 * M)
            ];

            rewards.forEach((fn, index) => {
                const result = Y !== 0 ? fn() : 0;
                document.getElementById(`reward${index+1}`).textContent = result.toFixed(2);
            });
        }
    </script>
</body>
</html>
